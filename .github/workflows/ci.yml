name: CI Pipeline - Microservices

on:
  push:
    branches:
      - dev

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        service:
          - api-gateway
          - eureka-server
          - config-server
          - company-service
          - inventory-service
          - supply-service
          - billing-service
          - generator-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Determine service path
        id: service-path
        run: |
          if [[ "${{ matrix.service }}" == "api-gateway" ]] || \
             [[ "${{ matrix.service }}" == "eureka-server" ]] || \
             [[ "${{ matrix.service }}" == "config-server" ]]; then
            echo "path=infrastructure/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "path=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.service }}-
            ${{ runner.os }}-maven-
      
      - name: Build and run tests
        working-directory: ${{ steps.service-path.outputs.path }}
        run: |
          echo "🔨 Building ${{ matrix.service }}..."
          echo "📂 Working directory: $(pwd)"
          mvn clean verify -B -U
        
      - name: Test results summary
        if: always()
        working-directory: ${{ steps.service-path.outputs.path }}
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Tests completed for ${{ matrix.service }}"
            find target/surefire-reports -name "*.xml" -exec echo "Found: {}" \;
          else
            echo "⚠️ No test reports found for ${{ matrix.service }}"
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ steps.service-path.outputs.path }}/target/surefire-reports/
          retention-days: 7
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.service }}
          path: ${{ steps.service-path.outputs.path }}/target/*.jar
          retention-days: 1

  docker-build-push:
    name: Docker Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - eureka-server
          - config-server
          - company-service
          - inventory-service
          - supply-service
          - billing-service
          - generator-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Determine service path
        id: service-path
        run: |
          if [[ "${{ matrix.service }}" == "api-gateway" ]] || \
             [[ "${{ matrix.service }}" == "eureka-server" ]] || \
             [[ "${{ matrix.service }}" == "config-server" ]]; then
            echo "path=infrastructure/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "path=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Extract commit SHA (short)
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.service-path.outputs.path }}
          file: ${{ steps.service-path.outputs.path }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:dev-${{ steps.commit.outputs.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
          platforms: linux/amd64
      
      - name: Docker image summary
        run: |
          echo "✅ Successfully built and pushed Docker images for ${{ matrix.service }}"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:dev-${{ steps.commit.outputs.sha }}"

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "❌ Build and test stage failed"
            exit 1
          fi
          
          if [[ "${{ needs.docker-build-push.result }}" != "success" ]]; then
            echo "❌ Docker build and push stage failed"
            exit 1
          fi
          
          echo "✅ All pipeline stages completed successfully"
          echo "🎉 All microservices built, tested, and deployed"
